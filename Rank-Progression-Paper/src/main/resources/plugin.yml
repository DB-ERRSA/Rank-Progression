name: Rank-Progression
version: '0.4.0'
main: me.RedEagle3.rankProgression.RankProgression
api-version: '1.21'

description: A custom rank progression system made for the ERRSA MC server.
author: The ERRSA MC Dev Team
website: https://campusgroups.erau.edu/errsa/craft/

commands:
  playtime:
    description: Shows your playtime statistics
    aliases: [pt]
  progression:
    description: Shows your rank progression
  syncrankprogression:
    description: Syncs all offline player's data into the proxy YML
    permission: rankprogression.syncrankprogression
  exportplaytimedata:
    description: Exports playtime data as an excel sheet for analytics
    permission: rankprogression.exportplaytimedata